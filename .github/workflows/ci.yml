name: Testes de Integração e Cobertura

on:
  push:
    branches: [ main, cloud ]
  pull_request:
    branches: [ main, cloud ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3.12-management
        ports:
          - 5672:5672
          - 15672:15672

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v3

      - name: 🧰 Instalar SDK do .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🧱 Restaurar pacotes
        run: dotnet restore MicroservicesApp.sln

      - name: 🛠️ Buildar solução
        run: dotnet build MicroservicesApp.sln --no-restore --configuration Release

      # <<<<< ALTERADO: força saída única Cobertura usando coverlet.msbuild >>>>>
      - name: 🧪 Rodar testes com cobertura (Coverlet MSBuild)
        run: |
          dotnet test IntegrationTests/IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutput=TestResults/coverage/ \
            /p:CoverletOutputFormat=cobertura

      - name: 📊 Gerar relatório de cobertura
        uses: danielpalme/ReportGenerator-GitHub-Action@5.2.0
        with:
          reports: 'TestResults/coverage/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura'

      - name: 📎 Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-de-codigo
          path: coveragereport
      
      - name: 🌐 Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coveragereport
