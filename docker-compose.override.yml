services:

  orderservice:
    container_name: orderservice
    build:
      context: ./src
      dockerfile: OrderService/Dockerfile.dev
    ports:
      - "5000:80"
    volumes:
      - ./src/OrderService:/app
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - ./logs:/app/logs
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - elastic-net

  paymentservice:
    container_name: paymentservice
    build:
      context: ./src
      dockerfile: PaymentService/Dockerfile.dev
    ports:
      - "5001:80"
    volumes:
      - ./src/PaymentService:/app
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - ./logs:/app/logs
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - elastic-net

  notificationservice:
    container_name: notificationservice
    build:
      context: ./src
      dockerfile: NotificationService/Dockerfile.dev
    ports:
      - "5002:80"
    volumes:
      - ./src/NotificationService:/app
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - ./logs:/app/logs
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - elastic-net

  authservice:
    container_name: authservice
    build:
      context: ./src
      dockerfile: AuthService/Dockerfile.dev
    ports:
      - "5003:80"
    volumes:
      - ./src/AuthService:/app
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - ./logs:/app/logs
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - elastic-net

  seq:
    image: datalust/seq:latest
    container_name: seq
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    environment:
      - ACCEPT_EULA=Y
    networks:
      - elastic-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - elastic-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  elastic-net:
    driver: bridge

volumes:
  seq-data:
